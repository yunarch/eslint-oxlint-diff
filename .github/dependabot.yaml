version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    versioning-strategy: increase
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: sunday
      time: '12:00'
      timezone: 'Europe/Madrid'
    groups:
      types:
        patterns:
          - '@types/*'
      tools:
        patterns:
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
          - '@oxlint/migrate'
          - 'husky'
          - 'rimraf'
          - 'typescript'
      build-tools:
        patterns:
          - 'tsdown'
      runtime:
        patterns:
          - 'commander'
          - 'jsonc-parser'
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: sunday
      time: '12:00'
      timezone: 'Europe/Madrid'
